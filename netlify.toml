[build]
  command = "npm run build"
  publish = "dist/mantrailing/browser"

[build.environment]
  NODE_VERSION = "22"

# Single-Page-App: alle Routen auf index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The app sits behind an access code – keep it out of search engines.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"
